# Manifest for scripts/supply-chain.py. Read by `just update` and `just audit`.
#
# Three layers, because they answer the same question at different depths and fail
# differently. Layer 1 is the only one that can WRITE flake.lock; 2 and 3 are report-only
# until the thing they describe is actually wired into a module.

[cooldown]
# Days a release must have existed before this repo will adopt it. 5 is the flake-input
# default; npm and the VS Code marketplaces get 14, matching
# modules/supply-chain-hardening.nix, because those are the ecosystems with live
# self-propagating campaigns and no Hydra-style gate in front of them.
inputs = 5
packages = 14
extensions = 14

[cooldown.per_input]
# Per-input override of the 5-day default, and the reason this exists rather than one
# global number: an input's age bounds the age of its CONTENTS only from below, and
# loosely. Measured 2026-08-22 with nixpkgs-llm-agents at 5.2 days old, the npm packages
# inside it were claude-code 7.9 d, opencode 9.6 d, gemini-cli 10.8 d, ccusage 7.1 d —
# all still inside the 14-day npm bar that layer 2 and
# modules/supply-chain-hardening.nix apply everywhere else.
#
# These CLIs run with the user's full privileges and hold API keys, and ChainDrop
# targets .claude.json and .codex/auth.json by name, so they get the npm bar rather than
# the flake-input bar. The cost is real and worth stating: claude-code moves roughly a
# week later than upstream.
nixpkgs-llm-agents = 14

# nix-vscode-extensions gets the EXTENSION bar, not the input bar, because for this
# input the two are the same number. It carries no version strings of its own: each
# daily revision pins whatever each registry served that day, so a revision N days old
# pins extension versions at least N days old. Setting 5 here would quietly grant every
# extension a 5-day cooldown while layer 3 below claims 14.
nix-vscode-extensions = 14

[freeze]
# Inputs `just update` must not touch at all, with the reason. A freeze is NOT a
# cooldown: it says "do not move this", not "move it to something older".
#
# Empty since 2026-08-26. nix-vscode-extensions was frozen here while it had zero
# consumers, held at rev 242a696 (2026-07-25) — one day before the Open VSX evil-twin
# campaign window (2026-07-26 .. 08-01, 77 counterfeit extensions beaconing to
# mangorbit[.]com). modules/vscode.nix now consumes it and [[extensions]] below is
# populated, which was the stated condition for unfreezing.
#
# Moving it forward does not walk into that window: the cooldown picks the NEWEST
# revision that clears the bar, so a 14-day bar lands near today-minus-14 — after the
# window closed on 08-01, not inside it. And a later snapshot is the safer one, because
# counterfeit extensions are REMOVED once noticed; freezing preserves whatever was true
# on the pinned day, including anything not yet found.
inputs = []

# ---------------------------------------------------------------------------------
# Layer 2 — packages worth dating individually.
#
# A flake input's age only bounds its contents from BELOW, and loosely: an
# llm-agents.nix rev from 5 days ago cannot pin an npm version published yesterday, but
# it can pin one published 5 days ago. These are the packages where that distinction
# carries real privilege, so they are dated against their own registry.
#
# The ecosystem is NOT recoverable from the derivation graph — measured 2026-08-22,
# claude-code's drv carries `src = /nix/store/…-claude` with empty inputDrvs, a bare
# store path with no deriver and no URL. So this mapping is hand-maintained out of
# necessity, not laziness. An entry that stops resolving is reported, never skipped.

[[packages]]
name = "claude-code"
input = "nixpkgs-llm-agents"
attr = "claude-code"
npm = "@anthropic-ai/claude-code"

[[packages]]
# A SECOND entry for the same npm package, deliberately, and the two standing
# next to each other are the whole point. Since the claude-code pin (flake.nix,
# input llm-agents-claude-code-pin, added 2026-09-02) the version installed on
# these machines is NOT the one the entry above dates. Without these lines
# `just audit` would keep reporting 2.1.234 as OK and would be quietly wrong
# about what is on the machine -- the failure class AGENTS.md names under
# "Validate the scan before believing 'no hits'". The entry above stays and keeps
# dating what the main input ships; this one dates what is actually installed.
#
# Expected output up to and including 2026-09-15: TOO NEW, exit 1. That is the
# wanted state, not a defect -- the pin is a deliberate cooldown undercut, and an
# audit that reported it as clean would be hiding exactly the fact that justifies
# the write-up in flake.nix.
#
# Two dates, both moved by the 2.1.247 -> 2.1.258 bump on 2026-09-03, and they
# are close enough to be confused: this ENTRY goes quiet once 2.1.258 itself
# turns 14 days old (published 2026-09-01 22:25Z, so from 2026-09-16), and the
# PIN can go away once nixpkgs-llm-agents ships >= 2.1.258, i.e. once `just
# update` with the same bar lands on a rev from 2026-09-01 23:07Z or later --
# also 2026-09-16 at the earliest. A quiet entry is therefore not by itself
# permission to remove the pin; the assertion in modules/mcp-servers.nix is what
# says when, and it breaks the build rather than waiting to be noticed.
name = "claude-code (pinned)"
input = "llm-agents-claude-code-pin"
attr = "claude-code"
npm = "@anthropic-ai/claude-code"

[[packages]]
name = "codex"
input = "nixpkgs-llm-agents"
attr = "codex"
npm = "@openai/codex"

[[packages]]
name = "opencode"
input = "nixpkgs-llm-agents"
attr = "opencode"
npm = "opencode-ai"

[[packages]]
name = "gemini-cli"
input = "nixpkgs-llm-agents"
attr = "gemini-cli"
npm = "@google/gemini-cli"

[[packages]]
name = "ccusage"
input = "nixpkgs-llm-agents"
attr = "ccusage"
npm = "ccusage"

# ---------------------------------------------------------------------------------
# Layer 3 — VS Code extensions.
#
# DELIBERATELY EMPTY. The default-extension set this repo intends to manage through
# nix-vscode-extensions does not exist yet, and inventing one here would be a guess
# presented as configuration. The machinery is implemented and tested (exercise it with
# `just audit-extensions <id>…`); add entries in the same change that wires the input
# into a module, and drop nix-vscode-extensions from [freeze] at the same time.
#
# The rule applied to each entry, which is stricter than a plain cooldown:
#   1. the extension must STILL EXIST upstream today  (404 => hard failure, not a skip)
#   2. the chosen version must be at least `extensions` days old
#   3. that version must still be listed today — an individually withdrawn version is
#      rejected even though it was old enough
#   4. non-deprecated, non-prerelease, and the namespace/publisher verified
#
# Rule 3 is the one a plain cooldown misses, and it is the one that matters here: a
# malicious extension is REMOVED once noticed, so "is it still there?" is the signal
# that a date cannot give you. Same shape as the FlakeHub `yanked_at` check in layer 1,
# which caught determinate 3.22.0 — old enough at 15 days, but yanked.
#
# Populated 2026-08-26, in the same change that wired the input into
# modules/vscode.nix and emptied [freeze] above. Registry per entry, because Open VSX is
# not a faithful mirror — measured that day, it served path-intellisense 2.8.0 (2022)
# against the marketplace's 2.10.0, and answered 404 for vscode-dash outright.
#
# NOTE these were array-of-tables from the start for a reason. The placeholder this
# replaced was a bare `extensions = []` sitting AFTER the [[packages]] tables, so TOML
# parsed it as a key of the last package (ccusage) rather than a top-level list —
# `manifest.get("extensions")` never saw it. Harmless while empty, since the fallback is
# also []; not harmless the moment anything is declared. Keep this section last and keep
# it as [[extensions]].
#
# What this layer does NOT check: it resolves its own candidate version from the
# registry and reports that. It does not read the version nix-vscode-extensions actually
# pins, so a clean run means "this extension is still healthy upstream", not "the
# installed version is healthy". Rules 1 and 3 — still there, still listed — are the
# withdrawal signal, and those are what a date cannot give you.

[[extensions]]
id = "bmalehorn.vscode-fish"
registry = "open-vsx"

[[extensions]]
id = "christian-kohler.path-intellisense"
registry = "vscode-marketplace"      # Open VSX is stuck on 2.8.0 (2022-02)

[[extensions]]
id = "davidanson.vscode-markdownlint"
registry = "open-vsx"

[[extensions]]
id = "deerawan.vscode-dash"
registry = "vscode-marketplace"      # not on Open VSX at all (404)

[[extensions]]
id = "docker.docker"
registry = "open-vsx"

[[extensions]]
# Audited against the marketplace although modules/vscode.nix takes it from Open VSX.
# GitLens ships nightlies — 1141 of its 1488 listed versions are pre-releases — and the
# Open VSX walk costs one HTTP request per version, so it is capped at 40 and never
# reaches a release build. The marketplace returns the whole list in one request.
id = "eamodio.gitlens"
registry = "vscode-marketplace"

[[extensions]]
id = "jebbs.plantuml"
registry = "open-vsx"

[[extensions]]
id = "jnoortheen.nix-ide"
registry = "open-vsx"

[[extensions]]
id = "marclipovsky.string-manipulation"
registry = "open-vsx"

[[extensions]]
id = "ms-azuretools.vscode-containers"
registry = "vscode-marketplace"      # Open VSX lags: 2.4.5 against 2.5.0

[[extensions]]
id = "ms-kubernetes-tools.vscode-kubernetes-tools"
registry = "open-vsx"

[[extensions]]
id = "ms-vscode.hexeditor"
registry = "open-vsx"

[[extensions]]
id = "pomdtr.excalidraw-editor"
registry = "vscode-marketplace"      # Open VSX is stuck on 3.9.0

[[extensions]]
id = "redhat.vscode-yaml"
registry = "open-vsx"

[[extensions]]
id = "vscode-icons-team.vscode-icons"
registry = "open-vsx"

[[extensions]]
id = "yzhang.markdown-all-in-one"
registry = "vscode-marketplace"      # Open VSX is stuck on 3.6.2 (2024-01)
