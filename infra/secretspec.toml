[project]
name = "nix-darwin-infra" # matches infra/Pulumi.yaml and infra/package.json
revision = "1.0"

[providers]
# Relative paths in a sops:// URI resolve from this file's directory, not the
# shell's cwd — this points at repo-root secrets/infra.enc.yaml, the same
# file the `just pulumi` wrapper decrypted by hand before this existed.
infra_sops = "sops://../secrets/infra.enc.yaml"

[profiles.default]
# `ref.item` names the SOPS file's existing flat, un-namespaced top-level
# keys directly — see infra/Architecture.md §9 "SecretSpec as the injection
# layer for infra/ secrets". No project/profile convention path is involved,
# so nothing about the on-disk layout changes.
PULUMI_ACCESS_TOKEN    = { description = "Pulumi Cloud access token", ref = { item = "pulumi_access_token" }, providers = ["infra_sops"] }
CLOUDFLARE_API_TOKEN   = { description = "Cloudflare API token — default provider for `pulumi up`/`preview` and for `pulumi import`", ref = { item = "cloudflare_api_token" }, providers = ["infra_sops"] }
AWS_ACCESS_KEY_ID      = { description = "AWS access key, IAM user pulumi-deploy (account 155895292230)", ref = { item = "aws_access_key_id" }, providers = ["infra_sops"] }
AWS_SECRET_ACCESS_KEY  = { description = "AWS secret key, IAM user pulumi-deploy (account 155895292230)", ref = { item = "aws_secret_access_key" }, providers = ["infra_sops"] }
