creation_rules:
  - path_regex: ^secrets/secrets\.enc\.yaml$
    pgp: ["B6CA7BD9B0973FBF981C3B1E7C8C077F1B72E98B"]
    age: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItmRvgucsqvH3CkT74Iz0/Qurs8QGopIyThHJqRmE94", "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKFr5M5JvZRT4GHj57xF9jng6f/w+pflOLLh6pc6c+EP", "age1vygfenpy584kvfdge57ep2vwqqe33zd4auanwu7frmf0tht5jq0q5ugmgd", "age1ae3vaq0cwzd8y0eatczdz7dz26m3mpxfnelwfxle9mqdachftd7q96fvaz"]
  # Pulumi-operation secrets (PULUMI_ACCESS_TOKEN, cloudflare_api_token). Recipients:
  # the workstations that run Pulumi + recovery keys. See infra/Architecture.md §2.
  - path_regex: ^secrets/infra\.enc\.yaml$
    pgp: ["B6CA7BD9B0973FBF981C3B1E7C8C077F1B72E98B"]
    age: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItmRvgucsqvH3CkT74Iz0/Qurs8QGopIyThHJqRmE94", "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKFr5M5JvZRT4GHj57xF9jng6f/w+pflOLLh6pc6c+EP", "age1vygfenpy584kvfdge57ep2vwqqe33zd4auanwu7frmf0tht5jq0q5ugmgd", "age1ae3vaq0cwzd8y0eatczdz7dz26m3mpxfnelwfxle9mqdachftd7q96fvaz"]
  - path_regex: ^hosts/FCX19GT9XR/secrets\.enc\.yaml$
    pgp: ["B6CA7BD9B0973FBF981C3B1E7C8C077F1B72E98B", "36A6E3D6E5D729A721639CD84019D2B96C630FDD"]
    age: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItmRvgucsqvH3CkT74Iz0/Qurs8QGopIyThHJqRmE94", "age1vygfenpy584kvfdge57ep2vwqqe33zd4auanwu7frmf0tht5jq0q5ugmgd", "age1ae3vaq0cwzd8y0eatczdz7dz26m3mpxfnelwfxle9mqdachftd7q96fvaz"]
  - path_regex: ^hosts/DKL6GDJ7X1/secrets\.enc\.yaml$
    age: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKFr5M5JvZRT4GHj57xF9jng6f/w+pflOLLh6pc6c+EP", "age1vygfenpy584kvfdge57ep2vwqqe33zd4auanwu7frmf0tht5jq0q5ugmgd", "age1ae3vaq0cwzd8y0eatczdz7dz26m3mpxfnelwfxle9mqdachftd7q96fvaz"]
  # The IONOS VPS — the first NON-workstation recipient, and the first on the
  # nixos class at all. Two differences from the rules above are deliberate:
  #
  #   * The first entry is the SERVER's own key. It was generated ON the host
  #     (`ssh-keygen -t ed25519 -N ""` into /var/lib/sops-nix/, mode 0400) and
  #     its private half has never left it — which is the point. Fingerprint
  #     SHA256:GUU7lgo9FIlFnZCNdab/A2WGFH14NKYZcFmOoLdV29Y.
  #   * A dedicated key rather than /etc/ssh/ssh_host_ed25519_key: the host key
  #     is regenerated by a reinstall, which would silently make every secret of
  #     this host unreadable at the worst possible moment.
  #
  # Losing the server's key is survivable and needs no backup: the plaintext
  # secrets live in 1Password, so the cost is re-encrypting this one file, not
  # losing anything. Both workstations stay recipients so that `sops edit` works
  # from either Mac without involving the server.
  #
  # THE age1 CONVERSION IS THE ONE THAT ACTUALLY WORKS. Listing only the
  # ssh-ed25519 form looks right and fails at activation:
  #
  #   sops-install-secrets: Imported /var/lib/sops-nix/ssh_ed25519_sops as age
  #                         key with fingerprint age1v5xe0z337y8f7…
  #   failed to decrypt: Error getting data key: 0 successful groups required, got 0
  #
  # sops-nix converts the SSH private key to an age X25519 identity, and an
  # X25519 identity cannot open an ssh-ed25519 recipient stanza — they are
  # different recipient types. That is why every rule above carries both forms.
  # The ssh-ed25519 entry is kept anyway: it is what a human reading this file
  # can match against a known_hosts line or `ssh-keygen -lf`.
  - path_regex: ^hosts/ionos-vps/secrets\.enc\.yaml$
    pgp: ["B6CA7BD9B0973FBF981C3B1E7C8C077F1B72E98B"]
    age: ["age1v5xe0z337y8f7uq5aa8aedz7k4sz72zlcnk2f6azjz87fpdes5nqj6cl5a", "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMoFAZXY9kFJjRBW/wDc6TJte+pP8Ov4KyK6MDpADV4h", "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItmRvgucsqvH3CkT74Iz0/Qurs8QGopIyThHJqRmE94", "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKFr5M5JvZRT4GHj57xF9jng6f/w+pflOLLh6pc6c+EP", "age1vygfenpy584kvfdge57ep2vwqqe33zd4auanwu7frmf0tht5jq0q5ugmgd", "age1ae3vaq0cwzd8y0eatczdz7dz26m3mpxfnelwfxle9mqdachftd7q96fvaz"]
  # Default for any path not matched above — same recipients as the Pulumi rule:
  # both workstations (in ssh-ed25519 form, which is what an SSH identity can
  # actually open) plus the age1 conversions and the PGP recovery key.
  #
  # MUST STAY LAST. sops takes the FIRST matching creation rule, not the most
  # specific one, so a catch-all placed higher would shadow every rule above it —
  # verified: with `path_regex: ""` first, a file matching ^test\.yaml$ was
  # encrypted to the catch-all's recipients and the specific rule never applied.
  #
  # Trade-off this accepts: `sops -e <new file>` now always succeeds instead of
  # failing with "no matching creation rules found". That loud failure was a
  # useful prompt to think about recipients, but every rule here shares the same
  # key set anyway, so the default cannot produce a file nobody can open.
  - path_regex: .*
    pgp: ["B6CA7BD9B0973FBF981C3B1E7C8C077F1B72E98B"]
    age: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItmRvgucsqvH3CkT74Iz0/Qurs8QGopIyThHJqRmE94", "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKFr5M5JvZRT4GHj57xF9jng6f/w+pflOLLh6pc6c+EP", "age1vygfenpy584kvfdge57ep2vwqqe33zd4auanwu7frmf0tht5jq0q5ugmgd", "age1ae3vaq0cwzd8y0eatczdz7dz26m3mpxfnelwfxle9mqdachftd7q96fvaz"]
